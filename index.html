<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محول الويب إلى تطبيقات PWA و Android</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
:root {
    --bg-color:#0f172a; --panel-bg:#1e293b; --accent-color:#6366f1;
    --text-color:#f8fafc; --border-color:#334155;
}
* { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
body { background:var(--bg-color); color:var(--text-color); height:100vh; overflow:hidden; }
.app-container { display:grid; grid-template-columns:1fr 400px; height:100vh; }
.editor-section { padding:20px; display:flex; flex-direction:column; gap:15px; overflow-y:auto; }
.config-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.input-group { display:flex; flex-direction:column; gap:5px; }
.input-group label { font-size:0.85rem; color:#94a3b8; }
input[type="text"], input[type="color"] {
    padding:8px 12px; background:var(--panel-bg); border:1px solid var(--border-color);
    color:white; border-radius:6px; width:100%;
}
input[type="color"] { height:38px; cursor:pointer; }
.code-editors { display:flex; flex-direction:column; gap:10px; flex-grow:1; }
textarea {
    width:100%; height:120px; background:#090d16; color:#38bdf8;
    border:1px solid var(--border-color); border-radius:6px;
    padding:10px; font-family:monospace; font-size:0.9rem; resize:vertical;
}
.actions { display:flex; gap:10px; }
.btn {
    flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold;
    cursor:pointer; transition:0.2s; display:flex; align-items:center;
    justify-content:center; gap:8px; font-size:0.95rem;
}
.btn:disabled { opacity:0.6; cursor:not-allowed; }
.btn-pwa { background:#10b981; color:white; }
.btn-pwa:hover:not(:disabled) { background:#059669; }
.btn-android { background:var(--accent-color); color:white; }
.btn-android:hover:not(:disabled) { background:#4f46e5; }
.preview-section {
    background:#020617; border-right:1px solid var(--border-color);
    display:flex; align-items:center; justify-content:center; padding:20px;
}
.phone-frame {
    width:320px; height:640px; background:#000; border-radius:36px;
    border:8px solid #334155; display:flex; flex-direction:column;
    overflow:hidden; position:relative; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
}
.phone-header {
    background:var(--accent-color); height:28px; display:flex;
    justify-content:space-between; align-items:center; padding:0 15px;
    font-size:0.75rem; color:white;
}
iframe { width:100%; height:calc(100% - 28px); border:none; background:white; }
</style>
</head>
<body>
<div class="app-container">
    <div class="editor-section">
        <h2>مُحوّل التطبيقات (Web to App)</h2>

        <div class="config-grid">
            <div class="input-group">
                <label>اسم التطبيق:</label>
                <input type="text" id="appName" value="تطبيقي الرائع" maxlength="60">
            </div>
            <div class="input-group">
                <label>لون الثيم:</label>
                <input type="color" id="themeColor" value="#6366f1">
            </div>
        </div>

        <div class="code-editors">
            <div class="input-group">
                <label>كود HTML:</label>
                <textarea id="htmlCode"><h1>مرحباً بك في تطبيقي!</h1><p>هذا تطبيق ويب يعمل كـ PWA وتطبيق Android.</p><button onclick="sayHello()">اضغط هنا</button></textarea>
            </div>
            <div class="input-group">
                <label>كود CSS:</label>
                <textarea id="cssCode">body { font-family: sans-serif; text-align: center; padding: 20px; background: #f8fafc; }
h1 { color: #6366f1; }
button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; }</textarea>
            </div>
            <div class="input-group">
                <label>كود JS:</label>
                <textarea id="jsCode">function sayHello() { alert('التطبيق يعمل بنجاح!'); }</textarea>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-pwa" id="btnPwa">📦 تحميل PWA</button>
            <button class="btn btn-android" id="btnAndroid">🤖 تحميل مشروع Android</button>
        </div>
    </div>

    <div class="preview-section">
        <div class="phone-frame">
            <div class="phone-header" id="phoneHeader">
                <span>12:00</span>
                <span id="previewTitle">تطبيقي الرائع</span>
            </div>
            <!--
                sandbox="allow-scripts allow-modals" مقصود:
                - يسمح بتشغيل JS و alert/confirm/print
                - يمنع allow-same-origin لتفادي هروب iframe من sandbox
                - النتيجة: أكواد المستخدم معزولة بأمان (لا localStorage ولا DOM parent)
            -->
            <iframe id="previewFrame"
                    sandbox="allow-scripts allow-modals"
                    referrerpolicy="no-referrer"></iframe>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
